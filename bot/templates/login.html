<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sound Bot Login</title>
    <style>
        body { font-family: sans-serif; background: #1e1f22; color: #eee; display: flex;
               align-items: center; justify-content: center; height: 100vh; margin: 0; }
        form { background: #2b2d31; padding: 2rem; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box;
                background: #1e1f22; border: 1px solid #444; color: #eee; border-radius: 4px; }
        button { width: 100%; padding: 0.6rem; background: #5865f2; color: white;
                 border: none; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #4752c4; }
        .error { color: #f04747; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <form method="post" action="/login">
        <h2>🔊 Sound Bot</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
